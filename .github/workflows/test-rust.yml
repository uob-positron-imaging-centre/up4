name: Test Rust

on:
  pull_request:
    paths:
      - src/**
      - Cargo.toml
      - .github/workflows/test-rust.yml
  push:
    branches:
      - main
    paths:
        - src/**
        - Cargo.toml
        - .github/workflows/test-rust.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -C debuginfo=0  # Do not produce debug symbols to keep memory usage down
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
            ubuntu-latest, 
        #windows-latest
        ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref_name == 'uPPPP' }}

      - uses: awalsh128/cache-apt-pkgs-action@latest
        name: Cache apt packages
        with:
          packages: libhdf5-dev
          version: 1.0

      - name: Compile tests
        run: >
          cargo test --no-run

      - name: Run tests
        run: >
          cargo test 